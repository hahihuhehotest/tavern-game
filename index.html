
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>酒場経営ゲーム 試作品0.7</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #f5efe4;
      color: #30251b;
    }

    section {
      background: white;
      padding: 16px;
      margin: 12px 0;
      border-radius: 12px;
    }

    button, select {
      padding: 12px;
      margin: 4px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #b9a58c;
      background: #fff8ed;
      color: #30251b;
    }

    select {
      display: block;
      width: 100%;
      margin: 8px 0 16px;
    }

    button:disabled {
      opacity: 0.45;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
    }

    .status {
      font-weight: bold;
      color: #79552b;
    }

    .menu-box {
      padding: 12px;
      background: #f9f3e9;
      border-radius: 8px;
      line-height: 1.8;
      white-space: pre-line;
    }

    .adventurer {
      border: 1px solid #dfd0bb;
      border-radius: 10px;
      padding: 12px;
      margin: 12px 0;
    }

    .adventurer h3 {
      margin-top: 0;
    }

    .dialogue {
      background: #f9f3e9;
      padding: 10px;
      border-radius: 8px;
      line-height: 1.7;
      white-space: pre-line;
      margin-top: 10px;
    }

    .adventurer-progress {
      color: #79552b;
      font-weight: bold;
    }

    #log {
      white-space: pre-line;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .error {
      color: #a12622;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <h1>酒場経営ゲーム</h1>
  <p>試作品 0.7</p>

  <section>
    <h2>酒場の状態</h2>
    <p>日数：<span id="day">1</span>日目</p>
    <p>所持金：<span id="money">1000</span> G</p>
    <p>評判：<span id="reputation">0</span></p>
    <p>現在の段階：<span id="phase" class="status">読み込み中</span></p>
  </section>

  <section id="loadError" hidden>
    <h2>データの読み込みに失敗しました</h2>
    <p id="loadErrorMessage" class="error"></p>
    <p>data/adventurers.json のファイル名と内容を確認してください。</p>
  </section>

  <section id="morningSection" hidden>
    <h2>朝の行動</h2>
    <p>今日の行動を1つ選んでください。</p>
    <button onclick="morning('市場')">市場へ行く</button>
    <button onclick="morning('開拓本部')">開拓本部へ行く</button>
    <p id="morningResult">今日の行動を選んでください。</p>
  </section>

  <section id="preparationSection" hidden>
    <h2>営業準備</h2>
    <p>今日のお客に出す料理と飲み物を決めましょう。</p>

    <h3>料理の設定</h3>

    <label for="foodIngredient">食材</label>
    <select id="foodIngredient">
      <option value="肉">肉</option>
      <option value="魚">魚</option>
      <option value="穀物">穀物</option>
    </select>

    <label for="foodRichness">味の重さ</label>
    <select id="foodRichness">
      <option value="こってり">こってり</option>
      <option value="普通" selected>普通</option>
      <option value="あっさり">あっさり</option>
    </select>

    <label for="foodCooking">調理法</label>
    <select id="foodCooking">
      <option value="焼き物">焼き物</option>
      <option value="スープ">スープ</option>
      <option value="煮込み">煮込み</option>
      <option value="生">生</option>
    </select>

    <label for="foodFlavor">味付けの方向</label>
    <select id="foodFlavor">
      <option value="繊細">繊細</option>
      <option value="標準" selected>標準</option>
      <option value="大胆">大胆</option>
    </select>

    <h3>飲み物の設定</h3>

    <label for="drinkType">飲み物の種類</label>
    <select id="drinkType">
      <option value="穀物">穀物系</option>
      <option value="果実">果実系</option>
      <option value="その他">その他</option>
    </select>

    <label for="drinkAlcohol">アルコール度数</label>
    <select id="drinkAlcohol">
      <option value="高">高い</option>
      <option value="普通" selected>普通</option>
      <option value="低">低い</option>
      <option value="なし">ノンアルコール</option>
    </select>

    <label for="drinkSmell">香りの強さ</label>
    <select id="drinkSmell">
      <option value="強">強い</option>
      <option value="普通" selected>普通</option>
      <option value="弱">弱い</option>
    </select>

    <h3>本日のメニュー</h3>
    <div id="menuPreview" class="menu-box"></div>

    <button onclick="openTavern()">このメニューで酒場を営業する</button>
  </section>

  <section id="tavernSection" hidden>
    <h2>酒場の営業</h2>
    <p id="tavernResult"></p>

    <h3>本日のメニュー</h3>
    <div id="activeMenu" class="menu-box"></div>

    <h3>冒険者との会話</h3>
    <p id="talkCount" class="adventurer-progress">会話：0人</p>
    <div id="adventurerList"></div>

    <p id="allTalkedMessage" hidden>
      今日の冒険者全員との会話が終わりました。営業を終了できます。
    </p>

    <button id="endDayButton" onclick="endDay()" disabled>
      1日を終える（会話完了後）
    </button>
  </section>

  <section>
    <h2>記録</h2>
    <div id="log">ゲームを開始しました。</div>
  </section>

  <script>
    let day = 1;
    let money = 1000;
    let reputation = 0;
    let phase = "morning";
    let todaysMenu = {};
    let talkCount = 0;
    let currentAdventurerIndex = 0;
    let adventurers = [];

    async function loadAdventurers() {
      const response = await fetch("./data/adventurers.json");

      if (!response.ok) {
        throw new Error(
          "冒険者データを取得できませんでした。HTTP " + response.status
        );
      }

      const data = await response.json();

      if (!Array.isArray(data) || data.length === 0) {
        throw new Error("冒険者データが空か、配列形式ではありません。");
      }

      const ids = new Set();
      const validRanks = ["S", "A", "B", "C", "D", "E", "F", "G"];
      const validBravery = ["brave", "normal", "cautious"];
      const validJudgment = ["intuition", "normal", "deliberation"];
      const abilityNames = ["stamina", "magic", "speed", "experience"];

      data.forEach(function(adventurer) {
        if (
          !adventurer.id ||
          !adventurer.name ||
          !adventurer.race ||
          !adventurer.purpose ||
          !adventurer.impression ||
          !adventurer.dialogue
        ) {
          throw new Error(
            "各冒険者に id、name、race、purpose、impression、dialogue が必要です。"
          );
        }

        if (ids.has(adventurer.id)) {
          throw new Error("冒険者IDが重複しています：" + adventurer.id);
        }
        ids.add(adventurer.id);

        if (!validRanks.includes(adventurer.rank)) {
          throw new Error(
            adventurer.name + "のランクが不正です。S～Gを設定してください。"
          );
        }

        if (
          !adventurer.abilities ||
          !adventurer.personality
        ) {
          throw new Error(
            adventurer.name + "に abilities または personality がありません。"
          );
        }

        abilityNames.forEach(function(key) {
          const value = adventurer.abilities[key];

          if (
            typeof value !== "number" ||
            !Number.isFinite(value) ||
            value < 1 ||
            value > 10
          ) {
            throw new Error(
              adventurer.name + "の能力 " + key +
              " は1～10の数値にしてください。"
            );
          }
        });

        if (!validBravery.includes(adventurer.personality.bravery)) {
          throw new Error(
            adventurer.name +
            "の bravery は brave、normal、cautious のいずれかにしてください。"
          );
        }

        if (!validJudgment.includes(adventurer.personality.judgment)) {
          throw new Error(
            adventurer.name +
            "の judgment は intuition、normal、deliberation のいずれかにしてください。"
          );
        }
      });

      adventurers = data;
    }

    function renderAdventurers() {
      const list = document.getElementById("adventurerList");
      list.replaceChildren();

      adventurers.forEach(function(adventurer, index) {
        const card = document.createElement("div");
        card.className = "adventurer";
        card.id = "adventurerCard" + index;
        card.hidden = true;

        const progress = document.createElement("p");
        progress.className = "adventurer-progress";
        progress.textContent =
          "冒険者 " + (index + 1) + " / " + adventurers.length;

        const heading = document.createElement("h3");
        heading.textContent = adventurer.name;

        const race = document.createElement("p");
        race.textContent = "種族：" + adventurer.race;

        const impression = document.createElement("p");
        impression.textContent = "様子：" + adventurer.impression;

        const button = document.createElement("button");
        button.id = "talkButton" + index;
        button.textContent = "話しかける";
        button.addEventListener("click", function() {
          talkTo(index);
        });

        const dialogue = document.createElement("div");
        dialogue.id = "dialogue" + index;
        dialogue.className = "dialogue";
        dialogue.hidden = true;

        const nextButton = document.createElement("button");
        nextButton.id = "nextButton" + index;
        nextButton.textContent = "次の冒険者へ";
        nextButton.hidden = true;
        nextButton.addEventListener("click", function() {
          nextAdventurer(index);
        });

        card.appendChild(progress);
        card.appendChild(heading);
        card.appendChild(race);
        card.appendChild(impression);
        card.appendChild(button);
        card.appendChild(dialogue);
        card.appendChild(nextButton);
        list.appendChild(card);
      });

      document.getElementById("talkCount").textContent =
        "会話：0 / " + adventurers.length + "人";

      document.getElementById("allTalkedMessage").textContent =
        "今日の冒険者" + adventurers.length +
        "人との会話が終わりました。営業を終了できます。";
    }

    function updateStatus() {
      document.getElementById("day").textContent = day;
      document.getElementById("money").textContent = money;
      document.getElementById("reputation").textContent = reputation;

      const phaseNames = {
        morning: "朝の行動",
        preparation: "営業準備",
        tavern: "酒場の営業"
      };

      document.getElementById("phase").textContent = phaseNames[phase];
      document.getElementById("morningSection").hidden = phase !== "morning";
      document.getElementById("preparationSection").hidden =
        phase !== "preparation";
      document.getElementById("tavernSection").hidden = phase !== "tavern";
    }

    function addLog(message) {
      const log = document.getElementById("log");
      log.textContent += "\n" + message;
    }

    function morning(place) {
      if (phase !== "morning") return;

      phase = "preparation";
      document.getElementById("morningResult").textContent =
        place + "で行動しました。";

      money += 100;
      reputation += 1;

      addLog(
        day + "日目：朝の行動「" + place +
        "」。所持金 +100G、評判 +1。"
      );

      updateMenuPreview();
      updateStatus();
    }

    function getMenu() {
      return {
        ingredient: document.getElementById("foodIngredient").value,
        richness: document.getElementById("foodRichness").value,
        cooking: document.getElementById("foodCooking").value,
        flavor: document.getElementById("foodFlavor").value,
        drinkType: document.getElementById("drinkType").value,
        alcohol: document.getElementById("drinkAlcohol").value,
        smell: document.getElementById("drinkSmell").value
      };
    }

    function menuToText(menu) {
      return "料理\n" +
        "食材：" + menu.ingredient + "\n" +
        "味の重さ：" + menu.richness + "\n" +
        "調理法：" + menu.cooking + "\n" +
        "味付け：" + menu.flavor + "\n\n" +
        "飲み物\n" +
        "種類：" + menu.drinkType + "系\n" +
        "アルコール度数：" + menu.alcohol + "\n" +
        "香り：" + menu.smell;
    }

    function updateMenuPreview() {
      document.getElementById("menuPreview").textContent =
        menuToText(getMenu());
    }

    function openTavern() {
      if (phase !== "preparation") return;

      todaysMenu = getMenu();
      phase = "tavern";
      talkCount = 0;
      currentAdventurerIndex = 0;

      adventurers.forEach(function(adventurer, index) {
        document.getElementById("adventurerCard" + index).hidden = true;

        const button = document.getElementById("talkButton" + index);
        button.disabled = false;
        button.textContent = "話しかける";

        const dialogue = document.getElementById("dialogue" + index);
        dialogue.hidden = true;
        dialogue.textContent = "";

        document.getElementById("nextButton" + index).hidden = true;
      });

      document.getElementById("adventurerCard0").hidden = false;

      document.getElementById("tavernResult").textContent =
        day + "日目の酒場を営業しています。";

      document.getElementById("activeMenu").textContent =
        menuToText(todaysMenu);

      document.getElementById("talkCount").textContent =
        "会話：0 / " + adventurers.length + "人";

      document.getElementById("allTalkedMessage").hidden = true;
      document.getElementById("endDayButton").disabled = true;
      document.getElementById("endDayButton").textContent =
        "1日を終える（会話完了後）";

      addLog(day + "日目：酒場の営業を開始。");
      addLog("最初の冒険者「" + adventurers[0].name + "」が来店。");

      updateStatus();
    }

    function talkTo(index) {
      if (phase !== "tavern") return;
      if (index !== currentAdventurerIndex) return;

      const adventurer = adventurers[index];
      if (!adventurer) return;

      const button = document.getElementById("talkButton" + index);
      if (button.disabled) return;

      button.disabled = true;
      button.textContent = "会話済み";

      const dialogue = document.getElementById("dialogue" + index);
      dialogue.textContent = adventurer.dialogue;
      dialogue.hidden = false;

      talkCount++;

      document.getElementById("talkCount").textContent =
        "会話：" + talkCount + " / " + adventurers.length + "人";

      const nextButton = document.getElementById("nextButton" + index);
      nextButton.textContent =
        talkCount === adventurers.length
          ? "会話を終了する"
          : "次の冒険者へ";
      nextButton.hidden = false;

      addLog(
        day + "日目：" + adventurer.name +
        "と会話。話題：" + adventurer.purpose + "。"
      );
    }

    function nextAdventurer(index) {
      if (phase !== "tavern") return;
      if (index !== currentAdventurerIndex) return;
      if (talkCount <= index) return;

      document.getElementById("adventurerCard" + index).hidden = true;

      if (talkCount >= adventurers.length) {
        document.getElementById("allTalkedMessage").hidden = false;
        document.getElementById("endDayButton").disabled = false;
        document.getElementById("endDayButton").textContent = "1日を終える";

        addLog(day + "日目：全員との会話が終了。");
        return;
      }

      currentAdventurerIndex++;

      const next = adventurers[currentAdventurerIndex];
      document.getElementById(
        "adventurerCard" + currentAdventurerIndex
      ).hidden = false;

      addLog(
        day + "日目：次の冒険者「" + next.name + "」が来店。"
      );
    }

    function endDay() {
      if (phase !== "tavern") return;
      if (talkCount < adventurers.length) return;
      if (document.getElementById("endDayButton").disabled) return;

      addLog(day + "日目：営業を終了。");

      day++;
      phase = "morning";
      talkCount = 0;
      currentAdventurerIndex = 0;

      document.getElementById("morningResult").textContent =
        "今日の行動を選んでください。";

      addLog(day + "日目：新しい朝を迎えました。");
      updateStatus();
    }

    const menuInputs = [
      "foodIngredient",
      "foodRichness",
      "foodCooking",
      "foodFlavor",
      "drinkType",
      "drinkAlcohol",
      "drinkSmell"
    ];

    menuInputs.forEach(function(id) {
      document.getElementById(id).addEventListener(
        "change",
        updateMenuPreview
      );
    });

    async function initGame() {
      try {
        await loadAdventurers();
        renderAdventurers();
        updateMenuPreview();
        updateStatus();
        addLog("冒険者データを読み込みました。");
      } catch (error) {
        document.getElementById("phase").textContent =
          "データ読み込みエラー";

        document.getElementById("loadError").hidden = false;
        document.getElementById("loadErrorMessage").textContent =
          error.message;

        document.getElementById("morningSection").hidden = true;
        document.getElementById("preparationSection").hidden = true;
        document.getElementById("tavernSection").hidden = true;

        addLog("エラー：" + error.message);
      }
    }

    initGame();
  </script>
</body>
</html>
