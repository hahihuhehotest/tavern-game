
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>酒場経営ゲーム 試作品</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #f5efe4;
      color: #30251b;
    }

    section {
      background: white;
      padding: 16px;
      margin: 12px 0;
      border-radius: 12px;
    }

    button, select {
      padding: 12px;
      margin: 4px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #b9a58c;
      background: #fff8ed;
      color: #30251b;
    }

    select {
      display: block;
      width: 100%;
      margin: 8px 0 16px;
    }

    button:disabled {
      opacity: 0.45;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
    }

    .status {
      font-weight: bold;
      color: #79552b;
    }

    .menu-box {
      padding: 12px;
      background: #f9f3e9;
      border-radius: 8px;
      line-height: 1.8;
    }

    #log {
      white-space: pre-line;
      line-height: 1.7;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <h1>酒場経営ゲーム</h1>
  <p>試作品 0.3</p>

  <section>
    <h2>酒場の状態</h2>
    <p>日数：<span id="day">1</span>日目</p>
    <p>所持金：<span id="money">1000</span> G</p>
    <p>評判：<span id="reputation">0</span></p>
    <p>現在の段階：<span id="phase" class="status">朝の行動</span></p>
  </section>

  <section id="morningSection">
    <h2>朝の行動</h2>
    <p>今日の行動を1つ選んでください。</p>

    <button onclick="morning('市場')">
      市場へ行く
    </button>

    <button onclick="morning('開拓本部')">
      開拓本部へ行く
    </button>

    <p id="morningResult">今日の行動を選んでください。</p>
  </section>

  <section id="preparationSection" hidden>
    <h2>営業準備</h2>
    <p>
      今日のお客に出す料理と飲み物を決めましょう。
    </p>

    <h3>料理の設定</h3>

    <label for="foodIngredient">食材</label>
    <select id="foodIngredient">
      <option value="肉">肉</option>
      <option value="魚">魚</option>
      <option value="穀物">穀物</option>
    </select>

    <label for="foodRichness">味の重さ</label>
    <select id="foodRichness">
      <option value="こってり">こってり</option>
      <option value="普通" selected>普通</option>
      <option value="あっさり">あっさり</option>
    </select>

    <label for="foodCooking">調理法</label>
    <select id="foodCooking">
      <option value="焼き物">焼き物</option>
      <option value="スープ">スープ</option>
      <option value="煮込み">煮込み</option>
      <option value="生">生</option>
    </select>

    <label for="foodFlavor">味付けの方向</label>
    <select id="foodFlavor">
      <option value="繊細">繊細</option>
      <option value="標準" selected>標準</option>
      <option value="大胆">大胆</option>
    </select>

    <h3>飲み物の設定</h3>

    <label for="drinkType">飲み物の種類</label>
    <select id="drinkType">
      <option value="穀物">穀物系</option>
      <option value="果実">果実系</option>
      <option value="その他">その他</option>
    </select>

    <label for="drinkAlcohol">アルコール度数</label>
    <select id="drinkAlcohol">
      <option value="高">高い</option>
      <option value="普通" selected>普通</option>
      <option value="低">低い</option>
      <option value="なし">ノンアルコール</option>
    </select>

    <label for="drinkSmell">香りの強さ</label>
    <select id="drinkSmell">
      <option value="強">強い</option>
      <option value="普通" selected>普通</option>
      <option value="弱">弱い</option>
    </select>

    <h3>本日のメニュー</h3>
    <div id="menuPreview" class="menu-box"></div>

    <p>
      選んだ内容は、画面上でいつでも確認できます。
    </p>

    <button onclick="openTavern()">
      このメニューで酒場を営業する
    </button>
  </section>

  <section id="tavernSection" hidden>
    <h2>酒場の営業</h2>
    <p id="tavernResult"></p>

    <h3>本日のメニュー</h3>
    <div id="activeMenu" class="menu-box"></div>

    <p>
      今後ここに冒険者の来店、会話、料理や飲み物への反応を追加します。
    </p>

    <button onclick="endDay()">
      1日を終える
    </button>
  </section>

  <section>
    <h2>記録</h2>
    <div id="log">ゲームを開始しました。</div>
  </section>

  <script>
    let day = 1;
    let money = 1000;
    let reputation = 0;

    // morning: 朝の行動
    // preparation: 営業準備
    // tavern: 酒場の営業
    let phase = "morning";

    // 今日の料理・飲み物
    let today'sMenu = {};

    function updateStatus() {
      document.getElementById("day").textContent = day;
      document.getElementById("money").textContent = money;
      document.getElementById("reputation").textContent = reputation;

      const phaseNames = {
        morning: "朝の行動",
        preparation: "営業準備",
        tavern: "酒場の営業"
      };

      document.getElementById("phase").textContent =
        phaseNames[phase];

      document.getElementById("morningSection").hidden =
        phase !== "morning";

      document.getElementById("preparationSection").hidden =
        phase !== "preparation";

      document.getElementById("tavernSection").hidden =
        phase !== "tavern";
    }

    function addLog(message) {
      const log = document.getElementById("log");
      log.textContent += "\n" + message;
    }

    function morning(place) {
      if (phase !== "morning") {
        return;
      }

      phase = "preparation";

      document.getElementById("morningResult").textContent =
        place + "で行動しました。";

      // 試作品用の仮の報酬
      money += 100;
      reputation += 1;

      document.getElementById("preparationResult");

      addLog(
        day + "日目：朝の行動「" + place + "」を実行。"
        + " 所持金 +100G、評判 +1。"
      );

      updateMenuPreview();
      updateStatus();
    }

    function getMenu() {
      return {
        ingredient:
          document.getElementById("foodIngredient").value,
        richness:
          document.getElementById("foodRichness").value,
        cooking:
          document.getElementById("foodCooking").value,
        flavor:
          document.getElementById("foodFlavor").value,
        drinkType:
          document.getElementById("drinkType").value,
        alcohol:
          document.getElementById("drinkAlcohol").value,
        smell:
          document.getElementById("drinkSmell").value
      };
    }

    function menuToText(menu) {
      return "料理\n"
        + "食材：" + menu.ingredient + "\n"
        + "味の重さ：" + menu.richness + "\n"
        + "調理法：" + menu.cooking + "\n"
        + "味付け：" + menu.flavor + "\n\n"
        + "飲み物\n"
        + "種類：" + menu.drinkType + "\n"
        + "アルコール度数：" + menu.alcohol + "\n"
        + "香り：" + menu.smell;
    }

    function updateMenuPreview() {
      const preview = document.getElementById("menuPreview");
      if (preview) {
        preview.textContent = menuToText(getMenu());
      }
    }

    function openTavern() {
      if (phase !== "preparation") {
        return;
      }

      // 営業開始時点のメニューを確定
      today'sMenu = getMenu();

      phase = "tavern";

      document.getElementById("tavernResult").textContent =
        day + "日目の酒場を営業しています。";

      document.getElementById("activeMenu").textContent =
        menuToText(today'sMenu);

      addLog(
        day + "日目：酒場の営業を開始。"
        + " 料理は「" + today'sMenu.ingredient + "・"
        + today'sMenu.cooking + "」、飲み物は「"
        + today'sMenu.drinkType + "系」。"
      );

      updateStatus();
    }

    function endDay() {
      if (phase !== "tavern") {
        return;
      }

      addLog(day + "日目：営業を終了。");

      day += 1;
      phase = "morning";

      document.getElementById("morningResult").textContent =
        "今日の行動を選んでください。";

      addLog(day + "日目：新しい朝を迎えました。");

      updateStatus();
    }

    // 料理・飲み物を変更したら、メニュー表示も更新
    const menuInputs = [
      "foodIngredient",
      "foodRichness",
      "foodCooking",
      "foodFlavor",
      "drinkType",
      "drinkAlcohol",
      "drinkSmell"
    ];

    menuInputs.forEach(function(id) {
      document.getElementById(id).addEventListener(
        "change",
        updateMenuPreview
      );
    });

    // 初期表示
    updateMenuPreview();
    updateStatus();
  </script>
</body>
</html>
